# Alembic configuration for IP-SAKTI.
# The database URL is NOT stored here — env.py reads it from application settings
# (IPSAKTI_DATABASE_URL) so credentials are never committed.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
# sqlalchemy.url is set programmatically in env.py

[post_write_hooks]

# Logging configuration (used by alembic's logging.conf-style setup in env.py)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
