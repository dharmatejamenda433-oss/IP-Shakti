[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsakti"
version = "0.1.0"
description = "IP-SAKTI — citation-grounded AI knowledge and decision-support platform for Ayurveda/traditional-knowledge/IP/regulatory information (SIH26045)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "IP-SAKTI" }]

# Core runtime dependencies needed from the foundation/database phases onward.
# Heavy retrieval/ML libraries are declared as optional extras (see below) so the
# base install stays lean and tests can run without pulling torch at Phase 1-3.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8,<3.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt<4.1",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
# Retrieval + ingestion stack (Phases 6-14). Installed on demand.
retrieval = [
    "pymupdf>=1.24,<2.0",
    "rank-bm25>=0.2.2,<1.0",
    "qdrant-client>=1.9,<2.0",
    "sentence-transformers>=3.0,<4.0",
]
# Grounded generation provider (Phase 16).
generation = [
    "groq>=0.9,<1.0",
]
# Development / CI tooling.
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "types-passlib>=1.7.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ipsakti*"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["ipsakti", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
    "D",   # pydocstyle
]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, contain intentionally fake secrets, and need no docstrings.
"tests/**" = ["S101", "S105", "S106", "D"]
# Alembic env/templates: no docstring requirements.
"alembic/env.py" = ["D"]
# Generated migration files are machine-produced; relax style rules.
"alembic/versions/**" = ["D", "E501", "W291", "W293", "UP006", "UP007", "UP035", "I001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# mypy — strict-ish typed Python
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "passlib.*", "fitz.*", "groq.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests requiring external services (PostgreSQL, Qdrant)",
]
asyncio_mode = "auto"
